<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>framelab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236e56cf'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <style>
    :root, [data-theme="dark"] {
      --bg: #0c0c0e;
      --surface: #111114;
      --surface2: #18181d;
      --surface3: #1f1f26;
      --surface4: #26262f;
      --border: #26262f;
      --border2: #383845;
      --text: #e8e8f0;
      --text2: #9a9ab0;
      --text3: #7a7a94;
      --accent: #6e56cf;
      --accent2: #8b72e8;
      --accent-soft: rgba(110, 86, 207, 0.16);
      --accent-line: rgba(110, 86, 207, 0.4);
      --green: #3dd68c;
      --yellow: #f5c542;
      --red: #ef4444;
      --diff-add-bg: rgba(61, 214, 140, 0.10);
      --diff-add-fg: #87f0b8;
      --diff-del-bg: rgba(239, 68, 68, 0.10);
      --diff-del-fg: #ff8a8a;
      --shadow-pop: 0 10px 30px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.04) inset;
      --shadow-strong: 0 12px 36px rgba(0,0,0,0.5);
      --tsx: #3b82f6;
      --jsx: #f59e0b;
      --canvas-ground: #08080a;
    }
    [data-theme="light"] {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface2: #f2f2f4;
      --surface3: #e9e9ed;
      --surface4: #dededf;
      --border: #e5e5e9;
      --border2: #d0d0d6;
      --text: #17171b;
      --text2: #55555f;
      --text3: #6b6b78;
      --accent: #6e56cf;
      --accent2: #7c5fdc;
      --accent-soft: rgba(110, 86, 207, 0.10);
      --accent-line: rgba(110, 86, 207, 0.35);
      --green: #16a34a;
      --yellow: #b98900;
      --red: #dc2626;
      --diff-add-bg: rgba(34, 197, 94, 0.10);
      --diff-add-fg: #15803d;
      --diff-del-bg: rgba(239, 68, 68, 0.07);
      --diff-del-fg: #b91c1c;
      --shadow-pop: 0 10px 28px rgba(0,0,0,0.14);
      --shadow-strong: 0 4px 24px rgba(0,0,0,0.08);
      --tsx: #2563eb;
      --jsx: #d97706;
      --canvas-ground: #eeeef1;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 42px 1fr;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
    button { font-family: inherit; }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-radius: 4px;
    }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 0 10px 0 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      user-select: none;
    }
    .brand img { height: 18px; display: none; }
    [data-theme="dark"] .brand .logo-dark { display: block; }
    [data-theme="light"] .brand .logo-light { display: block; }
    .toolbar-sep { width: 1px; height: 18px; background: var(--border); }
    .current-file {
      font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace;
      color: var(--text3);
      max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      direction: rtl; text-align: left;
    }
    .toolbar-spacer { flex: 1; }
    .toolbar-actions { display: inline-flex; gap: 2px; align-items: center; }

    .viewport-group {
      display: inline-flex; align-items: center; gap: 1px;
      background: var(--surface2);
      border-radius: 6px; padding: 2px;
    }
    .viewport-group button {
      background: transparent; border: 0; cursor: pointer;
      color: var(--text3); padding: 3px 8px; border-radius: 4px;
      font: 500 11px Geist; letter-spacing: 0.01em;
      transition: color .12s, background .12s;
    }
    .viewport-group button:hover { color: var(--text2); }
    .viewport-group button.active { background: var(--surface4); color: var(--text); }
    .viewport-width {
      font: 11px "Geist Mono", ui-monospace, Menlo, monospace;
      color: var(--text3); min-width: 62px; text-align: right;
    }

    .icon-btn {
      background: transparent; border: 0; padding: 0;
      border-radius: 6px; cursor: pointer; color: var(--text3);
      display: inline-flex; align-items: center; justify-content: center;
      width: 27px; height: 27px;
      transition: color .12s, background .12s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface3); }
    .icon-btn.active { color: var(--text); background: var(--surface3); }
    .icon-btn:disabled { opacity: .35; cursor: default; }
    .icon-btn:disabled:hover { background: transparent; color: var(--text3); }
    .icon-btn svg { display: block; }

    /* ---------- Layout ---------- */
    .layout {
      --left-width: 224px;
      --right-width: 290px;
      display: grid;
      grid-template-columns: var(--left-width) 1fr var(--right-width);
      height: 100%; min-height: 0;
    }
    .layout.left-collapsed { grid-template-columns: 1fr var(--right-width); }
    .layout.right-collapsed { grid-template-columns: var(--left-width) 1fr; }
    .layout.left-collapsed.right-collapsed { grid-template-columns: 1fr; }
    .layout.left-collapsed > aside.left,
    .layout.right-collapsed > aside.right { display: none; }
    body.is-resizing { cursor: col-resize !important; user-select: none; }
    body.is-resizing iframe { pointer-events: none; }

    aside.left, aside.right {
      background: var(--surface);
      display: flex; flex-direction: column;
      min-height: 0;
    }
    aside.left { border-right: 1px solid var(--border); }
    aside.right { border-left: 1px solid var(--border); overflow: hidden; position: relative; }

    .resize-handle {
      position: absolute; top: 0; bottom: 0; left: -3px;
      width: 6px; cursor: col-resize; z-index: 5; background: transparent;
    }
    .resize-handle::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: 2px;
      width: 1px; background: transparent; transition: background .15s, width .12s;
    }
    .resize-handle:hover::after, .resize-handle.dragging::after {
      background: var(--accent); width: 2px;
    }
    .layout.right-collapsed .resize-handle { display: none; }

    .panel-head {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 12px 6px;
      font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
      color: var(--text3); font-weight: 600;
      cursor: pointer; user-select: none;
    }
    .panel-head .chev { transition: transform .12s; display: inline-flex; }
    .panel-head.collapsed .chev { transform: rotate(-90deg); }
    .panel-head .count {
      margin-left: auto; font-weight: 500; letter-spacing: 0;
      text-transform: none; font-size: 10px;
    }
    .panel-body { overflow-y: auto; }
    .panel-body.collapsed { display: none; }
    .panel-section { border-bottom: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .panel-section.grow { flex: 1; min-height: 0; }
    .panel-section.grow .panel-body { flex: 1; }
    .list-empty { padding: 10px 12px 14px; color: var(--text3); font-size: 11.5px; line-height: 1.5; }

    /* File tree */
    .tree { padding: 0 0 6px; }
    .tree-node {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px 3px 0;
      font: 12px Geist; color: var(--text);
      cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden;
      border-left: 2px solid transparent;
    }
    .tree-node:hover { background: var(--surface2); }
    .tree-node.active { background: var(--accent-soft); border-left-color: var(--accent); }
    .tree-node .chev {
      width: 10px; flex-shrink: 0; color: var(--text3);
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform .12s;
    }
    .tree-node.expanded > .chev { transform: rotate(90deg); }
    .tree-node.leaf .chev { visibility: hidden; }
    .tree-node .icon {
      flex-shrink: 0; width: 14px; height: 14px; color: var(--text2);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .tree-node .icon.tsx { color: var(--tsx); }
    .tree-node .icon.jsx { color: var(--jsx); }
    .tree-node .icon.folder { color: var(--text3); }
    .tree-node .name {
      flex: 1; overflow: hidden; text-overflow: ellipsis;
      font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace;
    }

    /* Layer tree */
    .layer {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px 3px 0; cursor: pointer; user-select: none;
      white-space: nowrap; overflow: hidden;
      border-left: 2px solid transparent;
      font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace;
      color: var(--text2);
    }
    .layer:hover { background: var(--surface2); color: var(--text); }
    .layer.active { background: var(--accent-soft); border-left-color: var(--accent); color: var(--text); }
    .layer.hovered { background: var(--surface2); }
    .layer .twist {
      width: 12px; flex-shrink: 0; color: var(--text3);
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform .12s;
    }
    .layer.expanded > .twist { transform: rotate(90deg); }
    .layer.leaf .twist { visibility: hidden; }
    .layer .tag { color: inherit; }
    .layer .hint {
      color: var(--text3); font-size: 10.5px; overflow: hidden;
      text-overflow: ellipsis; flex: 1; min-width: 0;
    }
    .layer .lock { color: var(--text3); flex-shrink: 0; }

    /* ---------- Stage ---------- */
    .stage {
      position: relative;
      background-color: var(--canvas-ground);
      background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
      background-size: 22px 22px;
      padding: 20px;
      overflow: auto;
      display: flex; flex-direction: column; align-items: center; min-height: 0;
    }
    .iframe-shell {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 100%;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow-strong);
      transition: width .18s cubic-bezier(.2,.8,.2,1);
    }
    .iframe-shell iframe { width: 100%; height: 100%; border: 0; display: block; }

    .overlay {
      position: absolute; pointer-events: none;
      border: 1.5px solid var(--accent);
      border-radius: 2px; display: none; z-index: 10;
    }
    .overlay.show { display: block; }
    .overlay.smooth { transition: top .07s ease-out, left .07s ease-out, width .07s ease-out, height .07s ease-out; }
    .overlay-hover {
      position: absolute; pointer-events: none;
      border: 1px dashed var(--accent-line);
      border-radius: 2px; display: none; z-index: 9;
    }
    .overlay-hover.show { display: block; }
    .overlay-label {
      position: absolute;
      top: -19px; left: -1.5px;
      background: var(--accent); color: #fff;
      font: 500 10.5px "Geist Mono", ui-monospace, Menlo, monospace;
      padding: 1px 6px; border-radius: 3px;
      white-space: nowrap; pointer-events: none;
      max-width: 240px; overflow: hidden; text-overflow: ellipsis;
    }
    .overlay-label.below { top: auto; bottom: -19px; }
    .overlay-hover .overlay-label { background: var(--text3); }
    .overlay-size {
      position: absolute; bottom: -18px; right: -1.5px;
      background: var(--surface3); color: var(--text2);
      font: 10px "Geist Mono", ui-monospace, Menlo, monospace;
      padding: 1px 5px; border-radius: 3px; white-space: nowrap;
    }

    .drop-indicator {
      position: absolute; height: 3px; background: var(--accent2);
      border-radius: 2px; box-shadow: 0 0 10px rgba(139,114,232,.6);
      pointer-events: none; z-index: 12; display: none;
    }
    .drop-indicator.show { display: block; }
    .drop-indicator::before, .drop-indicator::after {
      content: ''; position: absolute; top: -3px; width: 9px; height: 9px;
      border-radius: 999px; background: var(--accent2);
    }
    .drop-indicator::before { left: -4px; }
    .drop-indicator::after { right: -4px; }
    .stage.dragging .iframe-shell { box-shadow: 0 0 0 2px var(--accent), var(--shadow-strong); }

    /* Toasts */
    .toasts {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 6px; z-index: 900;
      align-items: center; pointer-events: none;
    }
    .toast {
      background: var(--surface3); color: var(--text);
      border: 1px solid var(--border2);
      border-radius: 7px; padding: 7px 12px;
      font-size: 12px; box-shadow: var(--shadow-pop);
      display: flex; align-items: center; gap: 8px;
      animation: toast-in .16s ease-out;
      max-width: 460px; pointer-events: all;
    }
    .toast.error { border-color: var(--red); }
    .toast.error .toast-dot { background: var(--red); }
    .toast .toast-dot {
      width: 6px; height: 6px; border-radius: 999px; background: var(--green);
      flex-shrink: 0;
    }
    .toast .toast-action {
      background: transparent; border: 0; color: var(--accent2);
      cursor: pointer; font: 500 12px Geist; padding: 0 2px;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }

    /* Status */
    .status {
      display: flex; align-items: center; gap: 6px;
      color: var(--text3); font-size: 11px;
      padding: 9px 12px; border-top: 1px solid var(--border);
      margin-top: auto; flex-shrink: 0;
    }
    .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--text3); flex-shrink: 0; }
    .dot.connecting, .dot.syncing { background: var(--yellow); animation: pulse-dot 1.4s ease-in-out infinite; }
    .dot.connected { background: var(--green); }
    .dot.disconnected { background: var(--red); }
    @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    /* ---------- Right column ---------- */
    .right-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--surface); padding: 0 6px; gap: 2px; flex-shrink: 0;
    }
    .right-tabs button {
      flex: 1; background: transparent; color: var(--text3); border: 0;
      padding: 9px 6px; font: 500 12px Geist; cursor: pointer;
      border-bottom: 1.5px solid transparent;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      transition: color .12s;
    }
    .right-tabs button:hover { color: var(--text2); }
    .right-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
    .right-tabs .badge {
      font: 10px "Geist Mono", ui-monospace, Menlo, monospace;
      padding: 1px 5px; border-radius: 999px;
      background: var(--accent); color: white; min-width: 16px; text-align: center;
    }
    .right-tabs .badge.zero { background: var(--surface3); color: var(--text3); }
    .tab-pane { display: none; min-height: 0; }
    .tab-pane.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #pane-inspector.active { overflow: hidden; }
    #inspector-scroll { overflow-y: auto; flex: 1; min-height: 0; }

    /* ---------- Inspector ---------- */
    .inspector-empty {
      padding: 40px 22px; color: var(--text3); font-size: 12px;
      text-align: center; line-height: 1.7;
    }
    .inspector-empty kbd {
      font: 10.5px "Geist Mono", ui-monospace, Menlo, monospace;
      background: var(--surface3); border: 1px solid var(--border2);
      border-radius: 3px; padding: 1px 4px; color: var(--text2);
    }

    .breadcrumb {
      display: flex; align-items: center; gap: 2px;
      padding: 7px 10px 0; flex-wrap: nowrap; overflow-x: auto;
      scrollbar-width: none;
    }
    .breadcrumb::-webkit-scrollbar { display: none; }
    .breadcrumb button {
      background: transparent; border: 0; cursor: pointer;
      color: var(--text3); padding: 2px 4px; border-radius: 4px;
      font: 11px "Geist Mono", ui-monospace, Menlo, monospace;
      white-space: nowrap; transition: color .12s, background .12s;
    }
    .breadcrumb button:hover { color: var(--text); background: var(--surface2); }
    .breadcrumb button.current { color: var(--text2); }
    .breadcrumb .sep { color: var(--text3); opacity: .5; font-size: 10px; flex-shrink: 0; }

    .inspector-head {
      padding: 4px 12px 10px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 8px;
    }
    .inspector-head .tag { font: 600 13px Geist; color: var(--text); }
    .inspector-head .meta {
      font: 10.5px "Geist Mono", ui-monospace, Menlo, monospace;
      color: var(--text3); margin-left: auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .inspector-head .kind-badge {
      font-size: 9px; letter-spacing: .04em; text-transform: uppercase;
      padding: 1px 5px; border-radius: 3px; font-weight: 600;
      background: var(--surface3); color: var(--text3);
    }
    .inspector-head .kind-badge.call { background: rgba(110,86,207,.16); color: var(--accent2); }
    .inspector-head .kind-badge.template { background: rgba(245,197,66,.14); color: var(--yellow); }
    .inspector-head .head-action {
      background: transparent; border: 0; padding: 3px;
      margin: -3px -3px -3px 4px;
      border-radius: 5px; cursor: pointer; color: var(--text3);
      display: inline-flex; align-items: center; justify-content: center;
      align-self: center;
      transition: color .12s, background .12s;
    }
    .inspector-head .head-action:hover { color: var(--text); background: var(--surface3); }
    .inspector-head .head-action.danger:hover { color: var(--red); background: rgba(239,68,68,.12); }
    .inspector-head .head-action.ok { color: var(--green); }
    .inspector-head .head-action:disabled { opacity: .3; cursor: default; }
    .inspector-head .head-action:disabled:hover { color: var(--text3); background: transparent; }

    /* Variant bar */
    .variant-bar {
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
      background: var(--surface);
      position: sticky; top: 0; z-index: 6;
    }
    .variant-row { display: flex; align-items: center; gap: 6px; }
    .variant-row .vlabel {
      font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
      color: var(--text3); font-weight: 600; width: 26px; flex-shrink: 0;
    }
    .seg {
      display: flex; flex: 1; background: var(--surface2);
      border-radius: 6px; padding: 2px; gap: 1px; min-width: 0;
    }
    .seg button {
      flex: 1; background: transparent; color: var(--text3); border: 0;
      padding: 3px 2px; font: 500 11px Geist; cursor: pointer;
      border-radius: 4px; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: color .1s, background .1s;
    }
    .seg button.more { flex: 0 0 22px; font-size: 13px; line-height: 1; }
    .seg button:hover { color: var(--text2); background: var(--surface3); }
    .seg button.active { background: var(--surface4); color: var(--text); }
    .seg button.has-value::after {
      content: ''; display: block; width: 3px; height: 3px; border-radius: 999px;
      background: var(--accent2); margin: 1px auto 0;
    }
    .seg button.active.has-value::after { background: var(--accent2); }
    .variant-note {
      font-size: 10.5px; color: var(--text3); line-height: 1.45;
      display: flex; align-items: center; gap: 5px;
    }
    .variant-note b { color: var(--accent2); font-weight: 500; }

    /* Sections */
    .section { border-bottom: 1px solid var(--border); padding: 4px 0 8px; }
    .section h4 {
      margin: 0; padding: 7px 12px 5px;
      font-size: 11px; color: var(--text2); font-weight: 500;
      cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    .section h4 .section-chev {
      display: inline-flex; width: 10px; color: var(--text3);
      transition: transform .12s;
    }
    .section h4 .sec-count {
      margin-left: auto; font-size: 10px; color: var(--text3);
      font-family: "Geist Mono", ui-monospace, Menlo, monospace;
    }
    .section.collapsed .section-body { display: none; }
    .section.collapsed h4 .section-chev { transform: rotate(-90deg); }
    .section-body { padding: 2px 12px 2px; display: flex; flex-direction: column; gap: 5px; }

    .row { display: flex; align-items: center; gap: 6px; min-height: 24px; }
    .row > label {
      flex: 0 0 52px; font-size: 11px; color: var(--text3);
      user-select: none; white-space: nowrap;
    }
    .row.scrub > label { cursor: ew-resize; }
    .row.scrub > label:hover { color: var(--text); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .row-2 .row > label { flex: 0 0 18px; }

    /* Field: text input + optional token menu */
    .field {
      display: flex; align-items: center; flex: 1; min-width: 0;
      background: var(--surface2);
      border: 1px solid transparent; border-radius: 5px;
      transition: border-color .12s, background .12s;
      height: 24px;
    }
    .field:hover { border-color: var(--border2); }
    .field:focus-within { border-color: var(--accent); background: var(--surface3); }
    .field input {
      flex: 1; min-width: 0; width: 100%;
      background: transparent; border: 0; outline: none;
      color: var(--text); padding: 0 6px;
      font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace;
      height: 100%;
    }
    .field input::placeholder { color: var(--text3); }
    .field input.inherited { color: var(--text3); }
    .field .field-btn {
      background: transparent; border: 0; cursor: pointer;
      color: var(--text3); width: 18px; height: 100%;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; border-radius: 0 4px 4px 0;
    }
    .field .field-btn:hover { color: var(--text); background: var(--surface3); }
    .field.unit input { text-align: left; }

    /* Colour field */
    .color-field {
      display: flex; align-items: center; flex: 1; min-width: 0; gap: 0;
      background: var(--surface2); border: 1px solid transparent;
      border-radius: 5px; height: 24px; overflow: hidden;
      transition: border-color .12s;
    }
    .color-field:hover { border-color: var(--border2); }
    .color-field:focus-within { border-color: var(--accent); }
    .swatch {
      width: 24px; height: 100%; flex-shrink: 0; border: 0; cursor: pointer;
      padding: 0; position: relative;
      background-image:
        linear-gradient(45deg, var(--surface4) 25%, transparent 25%),
        linear-gradient(-45deg, var(--surface4) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--surface4) 75%),
        linear-gradient(-45deg, transparent 75%, var(--surface4) 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0;
      border-right: 1px solid var(--border);
    }
    .swatch .swatch-fill { position: absolute; inset: 0; }
    .color-field input {
      flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
      color: var(--text); padding: 0 6px; height: 100%;
      font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace;
    }
    .color-field input::placeholder { color: var(--text3); }

    /* Segmented icon control */
    .seg-icons { display: flex; flex: 1; background: var(--surface2); border-radius: 5px; padding: 2px; gap: 1px; }
    .seg-icons button {
      flex: 1; background: transparent; border: 0; cursor: pointer;
      color: var(--text3); border-radius: 4px; height: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      font: 500 11px Geist; transition: color .1s, background .1s;
    }
    .seg-icons button:hover { color: var(--text2); background: var(--surface3); }
    .seg-icons button.active { background: var(--surface4); color: var(--text); }

    /* Box model */
    .boxmodel {
      background: var(--surface2); border-radius: 6px;
      padding: 5px 6px 6px; position: relative; user-select: none;
    }
    .bm-label {
      position: absolute; font-size: 8px; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text3); font-weight: 600;
      top: 4px; left: 7px;
    }
    .bm-outer {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      grid-template-rows: 17px auto 17px;
      align-items: center; justify-items: center;
      gap: 1px;
      padding-top: 7px;
    }
    .bm-inner {
      grid-column: 2; grid-row: 2;
      background: var(--surface3); border-radius: 4px;
      padding: 3px; width: 100%; position: relative;
    }
    .bm-inner-grid {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      grid-template-rows: 16px auto 16px;
      align-items: center; justify-items: center; gap: 1px;
    }
    .bm-center {
      grid-column: 2; grid-row: 2;
      display: flex; align-items: center; justify-content: center;
      min-height: 16px;
    }
    .bm-in {
      width: 100%; max-width: 32px; height: 16px;
      background: transparent; border: 1px solid transparent;
      border-radius: 4px; text-align: center; color: var(--text);
      font: 10.5px "Geist Mono", ui-monospace, Menlo, monospace;
      outline: none; padding: 0; cursor: ns-resize;
    }
    .bm-in::placeholder { color: var(--text3); }
    .bm-in:hover { border-color: var(--border2); background: var(--bg); }
    .bm-in:focus { border-color: var(--accent); background: var(--bg); cursor: text; }
    .bm-link {
      background: transparent; border: 1px solid transparent; cursor: pointer;
      color: var(--text3); border-radius: 4px; padding: 2px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .bm-link:hover { color: var(--text); background: var(--surface4); }
    .bm-link.on { color: var(--accent2); border-color: var(--accent-line); }

    /* Popover */
    .popover {
      position: fixed; z-index: 1200;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      box-shadow: var(--shadow-pop);
      display: none; flex-direction: column;
      min-width: 180px; max-width: 280px;
      overflow: hidden;
    }
    .popover.show { display: flex; }
    .pop-search {
      padding: 6px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .pop-search input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 4px 7px; color: var(--text); outline: none;
      font: 11.5px Geist;
    }
    .pop-search input:focus { border-color: var(--accent); }
    .pop-list { overflow-y: auto; max-height: 232px; padding: 4px; }
    .pop-group {
      font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--text3); font-weight: 600; padding: 6px 7px 3px;
    }
    .pop-item {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 7px; border-radius: 5px; cursor: pointer;
      font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace;
      color: var(--text2); white-space: nowrap;
    }
    .pop-item:hover, .pop-item.cursor { background: var(--surface3); color: var(--text); }
    .pop-item.selected { color: var(--accent2); }
    .pop-item .pi-swatch {
      width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0;
      border: 1px solid rgba(128,128,128,.35);
    }
    .pop-item .pi-val { margin-left: auto; color: var(--text3); font-size: 10.5px; }
    .pop-empty { padding: 12px; color: var(--text3); font-size: 11.5px; text-align: center; }
    .pop-foot {
      border-top: 1px solid var(--border); padding: 6px;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .pop-foot input[type="color"] {
      width: 22px; height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer;
    }
    .pop-foot input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    .pop-foot input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 3px; }
    .pop-foot input[type="text"] {
      flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 4px 7px; color: var(--text); outline: none;
      font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace;
    }
    .pop-foot input[type="text"]:focus { border-color: var(--accent); }

    /* Text content + className readout */
    .text-content { padding: 8px 12px 10px; border-bottom: 1px solid var(--border); }
    .text-content .label {
      font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 5px;
      display: flex; align-items: center; gap: 7px;
    }
    .text-content .badge {
      font-size: 9px; padding: 1px 5px; border-radius: 999px;
      background: var(--surface3); color: var(--text3); font-weight: 500;
    }
    .text-content textarea {
      width: 100%; min-height: 32px; max-height: 160px;
      padding: 6px 8px; background: var(--surface2); color: var(--text);
      border: 1px solid transparent; border-radius: 5px;
      font: 12px Geist; outline: none; resize: vertical;
      transition: border-color .12s;
    }
    .text-content textarea:hover { border-color: var(--border2); }
    .text-content textarea:focus { border-color: var(--accent); background: var(--surface3); }
    .text-content textarea[disabled] { color: var(--text3); background: var(--surface); cursor: not-allowed; }
    .text-content .hint { font-size: 10px; color: var(--text3); margin-top: 4px; line-height: 1.45; }

    .classname-foot {
      border-top: 1px solid var(--border); background: var(--surface);
      padding: 7px 12px 9px; flex-shrink: 0;
    }
    .classname-foot .label {
      font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
      color: var(--text3); font-weight: 600; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .classname-foot .label .copy {
      margin-left: auto; cursor: pointer; letter-spacing: 0;
      text-transform: none; font-weight: 500; font-size: 10px;
    }
    .classname-foot .label .copy:hover { color: var(--text2); }
    .classname-foot .label .copy.flash { color: var(--green); }
    .cls-tokens {
      display: flex; flex-wrap: wrap; gap: 3px;
      max-height: 84px; overflow-y: auto;
      font: 10.5px "Geist Mono", ui-monospace, Menlo, monospace;
    }
    .cls-token {
      background: var(--surface2); border: 1px solid transparent;
      border-radius: 4px; padding: 1px 5px; color: var(--text2);
      white-space: nowrap;
    }
    .cls-token.known { color: var(--text); }
    .cls-token.variant { border-color: var(--border2); color: var(--accent2); }
    .cls-token.dynamic { color: var(--yellow); border-color: rgba(245,197,66,.3); }
    .cls-empty { color: var(--text3); font-size: 11px; }

    .bare-msg { padding: 16px 14px; color: var(--text2); font-size: 12px; line-height: 1.6; }
    .bare-msg b { color: var(--text); }
    .bare-msg code {
      font: 11px "Geist Mono", ui-monospace, Menlo, monospace;
      background: var(--surface3); padding: 1px 5px; border-radius: 3px; color: var(--text);
    }

    /* ---------- Diff panel ---------- */
    #diff-list { flex: 1; overflow-y: auto; min-height: 0; }
    .diff-empty { padding: 34px 18px; color: var(--text3); font-size: 12px; text-align: center; line-height: 1.7; }
    .diff-footer {
      flex-shrink: 0; border-top: 1px solid var(--border);
      padding: 9px 12px 11px; background: var(--surface);
      display: flex; flex-direction: column; gap: 7px;
    }
    .diff-footer-meta { display: flex; align-items: center; justify-content: space-between; }
    .diff-footer-meta .footer-label { font-size: 11px; font-weight: 500; color: var(--text2); }
    .diff-footer-meta-actions { display: flex; align-items: center; gap: 2px; }
    .diff-footer textarea {
      width: 100%; height: 48px; padding: 6px 9px;
      background: var(--surface2); color: var(--text);
      border: 1px solid transparent; border-radius: 5px;
      font: 12px Geist; outline: none; resize: none; transition: border-color .12s;
    }
    .diff-footer textarea:hover { border-color: var(--border2); }
    .diff-footer textarea:focus { border-color: var(--accent); }
    .commit-cta {
      width: 100%; padding: 7px 12px; background: var(--accent); color: white;
      border: 0; border-radius: 6px; font: 500 12px Geist; cursor: pointer;
      transition: background .12s, opacity .12s;
    }
    .commit-cta:hover:not(:disabled) { background: var(--accent2); }
    .commit-cta:disabled { opacity: .35; cursor: not-allowed; }
    .discard-link {
      background: transparent; border: 0; color: var(--text3); font: 11px Geist;
      cursor: pointer; padding: 1px 0; text-align: center; width: 100%;
    }
    .discard-link:hover:not(:disabled) { color: var(--red); }
    .discard-link:disabled { opacity: .3; cursor: not-allowed; }
    .auto-commit-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; border: 0; color: var(--text3); font: 11px Geist;
      cursor: pointer; padding: 3px 6px; border-radius: 4px;
    }
    .auto-commit-toggle:hover { color: var(--text2); background: var(--surface2); }
    .auto-commit-toggle.on { color: var(--text); }
    .auto-commit-toggle .pill {
      width: 20px; height: 11px; border-radius: 999px; background: var(--surface3);
      position: relative; flex-shrink: 0; transition: background .15s;
    }
    .auto-commit-toggle .pill::after {
      content: ''; position: absolute; top: 1px; left: 1px;
      width: 9px; height: 9px; border-radius: 999px; background: var(--text3);
      transition: transform .15s, background .15s;
    }
    .auto-commit-toggle.on .pill { background: var(--accent); }
    .auto-commit-toggle.on .pill::after { transform: translateX(9px); background: white; }

    .session-empty { padding: 30px 18px; color: var(--text2); font-size: 12px; text-align: center; line-height: 1.6; }
    .session-entry { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
    .session-entry .row1 { display: flex; align-items: baseline; gap: 8px; font-size: 11px; }
    .session-entry .time { color: var(--text3); font: 10px "Geist Mono", ui-monospace, Menlo, monospace; }
    .session-entry .sha { font: 10px "Geist Mono", ui-monospace, Menlo, monospace; color: var(--accent2); margin-left: auto; }
    .session-entry .msg { font: 12px "Geist Mono", ui-monospace, Menlo, monospace; color: var(--text); word-break: break-word; line-height: 1.45; }
    .session-entry .kind {
      display: inline-block; font-size: 9px; letter-spacing: .06em;
      padding: 1px 5px; border-radius: 3px; background: var(--surface3);
      color: var(--text2); text-transform: uppercase; font-weight: 600;
    }
    .session-entry .kind.style { background: rgba(110,86,207,.15); color: var(--accent2); }
    .session-entry .kind.text { background: rgba(245,197,66,.15); color: var(--yellow); }
    .session-entry .kind.move { background: rgba(61,214,140,.15); color: var(--green); }
    .session-entry .kind.revert { background: rgba(239,68,68,.15); color: var(--red); }

    .diff-file { border-bottom: 1px solid var(--border); }
    .diff-file-head {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      background: var(--surface); cursor: pointer; user-select: none;
    }
    .diff-file-head:hover { background: var(--surface2); }
    .diff-file-head .chev { color: var(--text3); font-size: 9px; width: 8px; transition: transform .12s; }
    .diff-file-head.collapsed .chev { transform: rotate(-90deg); }
    .diff-file-head .path {
      flex: 1; min-width: 0; font: 12px "Geist Mono", ui-monospace, Menlo, monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      direction: rtl; text-align: left;
    }
    .diff-file-head .stat { font: 11px "Geist Mono", ui-monospace, Menlo, monospace; color: var(--text3); }
    .diff-file-head .stat .add { color: var(--green); }
    .diff-file-head .stat .del { color: var(--red); }
    .revert-btn, .hunk-revert-btn {
      font: 10px Geist; background: transparent; color: var(--text3);
      border: 1px solid var(--border); padding: 1px 6px; cursor: pointer; border-radius: 3px;
      flex-shrink: 0;
    }
    .revert-btn:hover, .hunk-revert-btn:hover { border-color: var(--accent); color: var(--accent2); }
    .diff-file-body { font: 11px "Geist Mono", ui-monospace, Menlo, monospace; background: var(--bg); overflow-x: auto; }
    .diff-file-body.collapsed { display: none; }
    .diff-line { padding: 1px 12px; white-space: pre; min-height: 16px; }
    .diff-line.add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
    .diff-line.del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
    .diff-line.context { color: var(--text2); }
    .diff-line.hunk {
      color: var(--text3); background: var(--surface); padding: 3px 12px; font-size: 10px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .diff-line.hunk .hunk-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity .15s;
    }
    .modal-backdrop.show { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 10px; padding: 20px 20px 16px; width: 300px;
      box-shadow: var(--shadow-strong);
      transform: scale(.96) translateY(-4px); transition: transform .15s;
    }
    .modal-backdrop.show .modal { transform: scale(1) translateY(0); }
    .modal-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(239,68,68,.12); display: flex; align-items: center;
      justify-content: center; margin-bottom: 12px; color: var(--red);
    }
    .modal-title { font: 600 13px Geist; color: var(--text); margin-bottom: 5px; }
    .modal-desc { font: 12px Geist; color: var(--text2); line-height: 1.55; }
    .modal-desc code {
      font: 11px "Geist Mono", ui-monospace, Menlo, monospace;
      color: var(--text); background: var(--surface3); padding: 1px 5px; border-radius: 3px;
    }
    .modal-actions { display: flex; gap: 7px; margin-top: 18px; justify-content: flex-end; }
    .modal-actions button {
      padding: 6px 14px; border-radius: 5px; font: 500 12px Geist; cursor: pointer;
      border: 1px solid var(--border2); background: var(--surface2); color: var(--text2);
    }
    .modal-actions button:hover { background: var(--surface3); color: var(--text); }
    .modal-actions .modal-danger { background: var(--red); border-color: var(--red); color: white; }
    .modal-actions .modal-danger:hover { opacity: .88; }

    /* Scrollbar */
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 999px; }
    *::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <img class="logo-dark" src="logo-dark-bg.svg" alt="Framelab">
      <img class="logo-light" src="logo-light-bg.svg" alt="Framelab">
    </div>
    <div class="toolbar-sep"></div>
    <div class="current-file mono" id="current-file"></div>
    <div class="toolbar-spacer"></div>

    <div class="viewport-group" id="viewport-group"></div>
    <span class="viewport-width mono" id="viewport-width"></span>

    <div class="toolbar-sep"></div>
    <div class="toolbar-actions">
      <button class="icon-btn" id="undo-btn" aria-label="Undo" disabled></button>
      <button class="icon-btn" id="redo-btn" aria-label="Redo" disabled></button>
      <button class="icon-btn" id="reload-btn" aria-label="Reload preview"></button>
      <div class="toolbar-sep"></div>
      <button class="icon-btn" id="left-toggle" aria-label="Toggle file tree"></button>
      <button class="icon-btn" id="right-toggle" aria-label="Toggle inspector"></button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main class="layout">
    <aside class="left">
      <section class="panel-section">
        <div class="panel-head" data-panel-toggle="files">
          <span class="chev"></span> Files
        </div>
        <div class="panel-body" id="file-tree-body" style="max-height: 34vh;">
          <div id="file-tree"></div>
        </div>
      </section>
      <section class="panel-section grow">
        <div class="panel-head" data-panel-toggle="layers">
          <span class="chev"></span> Layers
          <span class="count mono" id="layer-count"></span>
        </div>
        <div class="panel-body" id="layer-body">
          <div id="layer-tree"></div>
        </div>
      </section>
      <div class="status" id="status">
        <span class="dot connecting"></span>
        <span class="status-text">connecting</span>
      </div>
    </aside>

    <section class="stage" id="stage">
      <div class="iframe-shell" id="iframe-shell">
        <iframe id="app-iframe" src="about:blank" title="App preview"></iframe>
        <div class="overlay-hover" id="hover-overlay"><span class="overlay-label" id="hover-label"></span></div>
        <div class="overlay" id="select-overlay">
          <span class="overlay-label" id="select-label"></span>
          <span class="overlay-size mono" id="select-size"></span>
        </div>
        <div class="drop-indicator" id="drop-indicator"></div>
      </div>
    </section>

    <aside class="right" id="right-column">
      <div class="resize-handle" id="resize-right" title="Drag to resize · double-click to reset"></div>
      <div class="right-tabs">
        <button id="tab-inspector" class="active" data-tab="inspector">Inspector</button>
        <button id="tab-diff" data-tab="diff">Diff <span class="badge zero" id="diff-badge">0</span></button>
      </div>

      <div class="tab-pane active" id="pane-inspector">
        <div id="inspector-scroll">
          <div class="inspector-empty" id="inspector-empty">
            Click any element in the preview to inspect it.
            <br/><br/>
            <span style="color: var(--text3); font-size: 11px;">
              <kbd>Esc</kbd> deselects · <kbd>↑</kbd> selects the parent<br/>
            <kbd>Del</kbd> removes it · <kbd>⌘Z</kbd> undoes
            </span>
          </div>
          <div id="inspector"></div>
        </div>
        <div class="classname-foot" id="classname-foot" hidden>
          <div class="label">
            className
            <span id="classname-kind"></span>
            <span class="copy" id="classname-copy">copy</span>
          </div>
          <div class="cls-tokens" id="classname-tokens"></div>
        </div>
      </div>

      <div class="tab-pane" id="pane-diff">
        <div id="diff-list">
          <div class="diff-empty">No pending changes.</div>
        </div>
        <div class="diff-footer">
          <div class="diff-footer-meta">
            <span class="footer-label">Commit changes</span>
            <div class="diff-footer-meta-actions">
              <button id="auto-commit-toggle" class="auto-commit-toggle" title="Commit each edit automatically">
                <span class="pill"></span><span>Auto</span>
              </button>
              <button id="diff-refresh-btn" class="icon-btn" title="Refresh diff" style="width:26px;height:26px;"></button>
            </div>
          </div>
          <textarea id="commit-message" spellcheck="false" placeholder="Summary (required)"></textarea>
          <button id="diff-commit-btn" class="commit-cta" disabled>Commit to branch</button>
          <button id="diff-discard-btn" class="discard-link" disabled>Discard all changes</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="popover" id="popover"></div>
  <div class="toasts" id="toasts"></div>

  <div class="modal-backdrop" id="confirm-modal">

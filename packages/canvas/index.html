      if (!hasProps && !hasText) return;
      flashStatus('connected');
      try {
        const payload = {};
        if (hasProps) payload.props = props;
        if (hasText) payload.textContent = text;
        const el = state.selectedElement;
        await pushUpdate(payload);
        // Auto-commit dispatch — choose the most descriptive kind. Style and
        // text edits are sent as separate commits if both present in one batch.
        if (UI.autoCommit && el) {
          const ctx = {
            filePath: state.currentFilePath,
            tagName: el.tagName,
            line: el.line,
          };
          if (hasProps) {
            const changes = [];
            for (const [prop, value] of Object.entries(props)) {
              if (value && typeof value === 'object' && !Array.isArray(value)) {
                for (const [sub, v] of Object.entries(value)) {
                  changes.push({ prop, sub, value: v });
                }
              } else {
                changes.push({ prop, value });
              }
            }
            await maybeAutoCommit('style', { ...ctx, changes });
          }
          if (hasText) {
            await maybeAutoCommit('text', { ...ctx, text });
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ---------- Helpers ----------
    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // ---------- Diff panel ----------
    const diffState = {
      data: null,            // last DIFF_SYNC payload
      collapsed: new Set(),  // file paths whose hunks are folded
    };

    // Atomic-commit session log: every commit made since the canvas connected
    // (auto + manual). Newest first. Capped to keep memory reasonable.
    const sessionLog = {
      commits: [],
      record(sha, message, kind) {
        if (!sha) return;
        this.commits.unshift({ sha, message, kind: kind || 'edit', time: new Date() });
        if (this.commits.length > 200) this.commits.length = 200;
        if (UI.autoCommit) renderDiff(diffState.data);
      },
    };

    // ---------- Auto-commit ----------
    function autoCommitMessage(kind, ctx) {
      const file = ctx.filePath ? basename(ctx.filePath) : '';
      const where = (ctx.tagName && ctx.line) ? ` ${ctx.tagName}@L${ctx.line}` : '';
      const fileTag = file ? `(${file})` : '';
      switch (kind) {
        case 'style': {
          const parts = (ctx.changes || []).slice(0, 3).map((c) => {
            const v = c.value === null || c.value === undefined ? '∅' : String(c.value);
            const subProp = c.sub ? `${c.prop}.${c.sub}` : c.prop;
            return `${subProp} → ${v}`;
          });
          const more = (ctx.changes && ctx.changes.length > 3) ? `, +${ctx.changes.length - 3} more` : '';
          return `style${fileTag}:${where} ${parts.join(', ')}${more}`;
        }
        case 'text': {
          const t = (ctx.text || '').replace(/\s+/g, ' ').trim();
          const trimmed = t.length > 40 ? t.slice(0, 40) + '…' : t;
          return `text${fileTag}:${where} → ${JSON.stringify(trimmed)}`;
        }
        case 'move':
          return `move${fileTag}:${where} ${ctx.position} ${ctx.targetTag}@L${ctx.targetLine}`;
        case 'revert-hunk':
          return `revert${fileTag}: hunk ${ctx.hunkIndex}`;
        case 'revert-file':
          return `revert${fileTag}`;
        default:
          return `edit${fileTag}`;
      }
    }

    async function maybeAutoCommit(kind, ctx) {
      if (!UI.autoCommit) return;
      const message = autoCommitMessage(kind, ctx);
      try {
        const res = await fetch(`${SERVER_URL}/diff/commit`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok && body.sha) {
          sessionLog.record(body.sha, message, kind.split('-')[0]);
        }
      } catch (e) {
        console.warn('auto-commit failed', e);
      }
    }

    function setAutoCommit(on) {
      UI.autoCommit = !!on;
      const btn = $('auto-commit-toggle');
      if (btn) btn.classList.toggle('on', UI.autoCommit);
      // Hide pending-only buttons when auto-commit is on (no manual commits needed)
      const commitBtn = $('diff-commit-btn');
      const discardBtn = $('diff-discard-btn');
      const msgEl = $('commit-message');
      const hide = UI.autoCommit ? 'none' : '';
      if (commitBtn) commitBtn.style.display = hide;
      if (discardBtn) discardBtn.style.display = hide;
      if (msgEl) msgEl.style.display = hide;
      saveUiPrefs();
      renderDiff(diffState.data);
    }
    function toggleAutoCommit() { setAutoCommit(!UI.autoCommit); }

    function switchTab(tab) {
      $('tab-inspector').classList.toggle('active', tab === 'inspector');
      $('tab-diff').classList.toggle('active', tab === 'diff');
      $('pane-inspector').classList.toggle('active', tab === 'inspector');
      $('pane-diff').classList.toggle('active', tab === 'diff');
    }

    async function fetchDiff() {
      try {
        const data = await api('GET', '/diff');
        renderDiff(data);
      } catch (e) {
        console.warn('fetchDiff failed', e);
      }
    }

    function renderDiff(data) {
      diffState.data = data || { initialized: false, files: [], diff: '' };
      const fileCount = (data && data.files && data.files.length) || 0;

      const badge = $('diff-badge');
      const list = $('diff-list');
      $('diff-commit-btn').disabled = fileCount === 0;
      $('diff-discard-btn').disabled = fileCount === 0;
      const msgEl = $('commit-message');
      if (msgEl && !msgEl.value && data && data.suggestedMessage) msgEl.value = data.suggestedMessage;
      if (msgEl && fileCount === 0) msgEl.value = '';

      // Session-log mode: replace the file diff view with the running log.
      if (UI.autoCommit) {
        const count = sessionLog.commits.length;
        badge.textContent = String(count);
        badge.classList.toggle('zero', count === 0);
        list.innerHTML = renderSessionLog();
        return;
      }

      badge.textContent = String(fileCount);
      badge.classList.toggle('zero', fileCount === 0);

      const empty = $('diff-empty');

      if (!data || !data.initialized) {
        list.innerHTML = '<div class="diff-empty">Not a git repository.<br/><br/>' +
          '<span style="color: var(--text3); font-size: 11px;">Run <span class="mono">git init</span> in your project to enable the diff panel.</span></div>';
        return;
      }

      if (fileCount === 0) {
        list.innerHTML = '<div class="diff-empty">No pending changes.<br/><br/>' +
          '<span style="color: var(--text3); font-size: 11px;">Edit a Tailwind class or text on the canvas to see your diff appear here.</span></div>';
        return;
      }

      const fileBlocks = parseUnifiedDiff(data.diff || '');
      const html = (data.files || []).map((f) => {
        const block = fileBlocks[f.path] || { added: 0, removed: 0, lines: [] };
        const isCollapsed = diffState.collapsed.has(f.path);
        return `
          <div class="diff-file" data-file="${escapeHtml(f.path)}">
            <div class="diff-file-head ${isCollapsed ? 'collapsed' : ''}" data-toggle="${escapeHtml(f.path)}">
              <span class="chev">▾</span>
              <span class="path" title="${escapeHtml(f.path)}">${escapeHtml(f.path)}</span>
              <span class="stat">
                <span class="add">+${block.added}</span>
                <span class="del">-${block.removed}</span>
              </span>
              <button class="revert-btn" data-revert="${escapeHtml(f.path)}" title="revert this file to HEAD">revert file</button>
            </div>
            <div class="diff-file-body ${isCollapsed ? 'collapsed' : ''}">
              ${block.lines.map((l) => renderDiffLine(l, f.path)).join('') ||
                '<div class="diff-line context" style="padding:8px 14px;color:var(--text3)">(new or untracked file)</div>'}
            </div>
          </div>`;
      }).join('');

      list.innerHTML = html;

      list.querySelectorAll('[data-toggle]').forEach((head) => {
        head.addEventListener('click', (e) => {
          if (e.target && e.target.dataset && e.target.dataset.revert !== undefined) return;
          const filePath = head.dataset.toggle;
          if (diffState.collapsed.has(filePath)) diffState.collapsed.delete(filePath);
          else diffState.collapsed.add(filePath);
          renderDiff(diffState.data);
        });
      });
      list.querySelectorAll('[data-revert]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const rel = btn.dataset.revert;
          showConfirmModal(
            `Discard all changes to <code>${rel}</code>? This will restore it to the last committed state.`,
            () => revertFile(rel)
          );
        });
      });
      list.querySelectorAll('[data-revert-hunk]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const filePath = btn.dataset.revertHunk;
          const hunkIndex = Number(btn.dataset.hunkIndex);
          await revertHunk(filePath, hunkIndex);
        });
      });
    }

    function renderSessionLog() {
      if (!sessionLog.commits.length) {
        return `<div class="session-empty">
          No edits yet this session.<br/><br/>
          <span style="color: var(--text3); font-size: 11px;">
            Make any edit (color, padding, drag, text) and watch it commit automatically.
          </span>
        </div>`;
      }
      const fmtTime = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      return `<div class="session-list">${
        sessionLog.commits.map((c) => `
          <div class="session-entry">
            <div class="row1">
              <span class="time">${fmtTime(c.time)}</span>
              <span class="kind ${escapeHtml(c.kind)}">${escapeHtml(c.kind)}</span>
              <span class="sha">${escapeHtml(c.sha)}</span>
            </div>
            <div class="msg">${escapeHtml(c.message)}</div>
          </div>`).join('')
      }</div>`;
    }

    function parseUnifiedDiff(diffText) {
      const result = {};
      if (!diffText) return result;
      const lines = diffText.split('\n');
      let currentFile = null;
      let hunkIdx = -1;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('diff --git ')) {
          const m = line.match(/^diff --git a\/(.*?) b\/(.+)$/);
          const fp = (m && m[2]) || null;
          if (fp) {
            currentFile = fp;
            result[currentFile] = { added: 0, removed: 0, lines: [], hunkCount: 0 };
            hunkIdx = -1;
          }
          continue;
        }
        if (!currentFile) continue;
        if (line.startsWith('index ') || line.startsWith('--- ') || line.startsWith('+++ ') ||
            line.startsWith('new file mode') || line.startsWith('deleted file mode') ||
            line.startsWith('similarity index') || line.startsWith('rename ') || line.startsWith('Binary files')) {
          continue;
        }
        if (line.startsWith('@@')) {
          hunkIdx++;
          result[currentFile].hunkCount = hunkIdx + 1;
          result[currentFile].lines.push({ kind: 'hunk', text: line, hunkIndex: hunkIdx });
          continue;
        }
        if (line.startsWith('+')) {
          result[currentFile].added++;
          result[currentFile].lines.push({ kind: 'add', text: line, hunkIndex: hunkIdx });
        } else if (line.startsWith('-')) {
          result[currentFile].removed++;
          result[currentFile].lines.push({ kind: 'del', text: line, hunkIndex: hunkIdx });
        } else {
          result[currentFile].lines.push({ kind: 'context', text: line, hunkIndex: hunkIdx });
        }
      }
      return result;
    }

    function renderDiffLine(line, filePath) {
      if (line.kind === 'hunk') {
        return `<div class="diff-line hunk">
          <span class="hunk-text">${escapeHtml(line.text)}</span>
          <button class="hunk-revert-btn"
                  data-revert-hunk="${escapeHtml(filePath)}"
                  data-hunk-index="${line.hunkIndex}"
                  title="revert just this hunk">revert hunk</button>
        </div>`;
      }
      return `<div class="diff-line ${line.kind}">${escapeHtml(line.text)}</div>`;
    }

    function showConfirmModal(desc, onConfirm) {
      const backdrop = $('confirm-modal');
      $('modal-desc').innerHTML = desc;
      backdrop.classList.add('show');

      function close() {
        backdrop.classList.remove('show');
        backdrop.removeEventListener('click', onBackdrop);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      function onBackdrop(e) { if (e.target === backdrop) close(); }

      document.addEventListener('keydown', onKey);
      backdrop.addEventListener('click', onBackdrop);
      $('modal-cancel').onclick = close;
      $('modal-confirm').onclick = () => { close(); onConfirm(); };
      $('modal-confirm').focus();
    }

    async function revertFile(relPath) {
      try {
        const res = await fetch(`${SERVER_URL}/diff/revert-file`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ filePath: relPath }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          flashError(body.error || `revert failed (${res.status})`);
          return;
        }
        // Force a full reload so any structural reverts don't trip Next's hydration
        reloadIframe();
        if (state.currentFilePath && state.currentFilePath.endsWith(relPath)) {
          loadFile(state.currentFilePath);
        }
        await maybeAutoCommit('revert-file', { filePath: relPath });
      } catch (e) {
        flashError(e.message || 'revert failed');
      }
    }

    async function revertHunk(relPath, hunkIndex) {
      try {
        const res = await fetch(`${SERVER_URL}/diff/revert-hunk`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ filePath: relPath, hunkIndex }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          flashError(body.error || `revert hunk failed (${res.status})`);
          return;
        }
        // The file just changed but we don't know what part. Refresh inspector
        // for the currently loaded file, and reload iframe in case the change
        // was structural (text/order).
        if (state.currentFilePath && state.currentFilePath.endsWith(relPath)) {
          loadFile(state.currentFilePath);
        }
        reloadIframe();
        await maybeAutoCommit('revert-hunk', { filePath: relPath, hunkIndex });
      } catch (e) {
        flashError(e.message || 'revert hunk failed');
      }
    }

    async function discardAll() {
      if (!confirm('Discard ALL pending changes and reset to HEAD?')) return;
      try {
        const res = await fetch(`${SERVER_URL}/diff/discard-all`, { method: 'POST' });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          flashError(body.error || 'discard failed');
          return;
        }
      } catch (e) {
        flashError(e.message || 'discard failed');
      }
    }

    async function commitChanges() {
      const msg = $('commit-message').value.trim();
      if (!msg) { flashError('commit message required'); return; }
      try {
        const res = await fetch(`${SERVER_URL}/diff/commit`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          flashError(body.error || `commit failed (${res.status})`);
          return;
        }
        $('commit-message').value = '';
        if (body.sha) sessionLog.record(body.sha, msg, 'manual');
        flashStatus('connected');
      } catch (e) {
        flashError(e.message || 'commit failed');
      }
    }

    function bindDiffControls() {
      document.querySelectorAll('.right-tabs button[data-tab]').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
      $('diff-refresh-btn').addEventListener('click', fetchDiff);
      $('diff-discard-btn').addEventListener('click', discardAll);
      $('diff-commit-btn').addEventListener('click', commitChanges);
      $('commit-message').addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') commitChanges();
      });
      $('auto-commit-toggle').addEventListener('click', toggleAutoCommit);
      setAutoCommit(UI.autoCommit);
    }

    // ---------- Bootstrap ----------
    function init() {
      loadUiPrefs();
      setUiTheme(UI.theme);
      $('theme-toggle').addEventListener('click', toggleUiTheme);

      // Panel toggles
      $('left-toggle').innerHTML = ICONS.panelLeft;
      $('right-toggle').innerHTML = ICONS.panelRight;
      applyRightWidth(UI.rightWidth);
      setupRightResize();
      setPanel('left', UI.panels.left);
      setPanel('right', UI.panels.right);
      $('left-toggle').addEventListener('click', () => togglePanel('left'));
      $('right-toggle').addEventListener('click', () => togglePanel('right'));

      // Keyboard shortcuts (skip when typing in inputs)
      document.addEventListener('keydown', (e) => {
        const tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
            (e.target && e.target.isContentEditable)) return;
        if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey) {
          const k = e.key.toLowerCase();
          if (k === 'b') { e.preventDefault(); togglePanel('left'); }
          else if (k === 'j') { e.preventDefault(); togglePanel('right'); }
        }
      });

      $('app-iframe').src = APP_URL;
      bindDiffControls();
      connectWS();
      fetchFiles();
      fetchTheme();
      fetchDiff();
    }
    init();
  </script>

  <div class="modal-backdrop" id="confirm-modal">
    <div class="modal">
      <div class="modal-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </div>
      <div class="modal-title">Revert changes</div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm" class="modal-danger">Revert</button>
      </div>
    </div>
  </div>
</body>
</html>
